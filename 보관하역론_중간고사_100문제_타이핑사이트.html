<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보관하역론 중간고사 - 타이핑 연습</title>
<style>
:root {
 --primary:#7c3aed;--primary-dark:#6d28d9;--bg:#f5f3ff;--card:#fff;--text:#1e1b4b;--muted:#6b7280;
 --ib:#c4b5fd;--if:#7c3aed;--cBg:#dcfce7;--cBd:#86efac;--cTx:#166534;--hBg:#fef9c3;--hBd:#fde68a;--hTx:#854d0e;
}
*{box-sizing:border-box;margin:0;padding:0} body{font-family:"Malgun Gothic","Pretendard",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;word-break:keep-all}
.btn{padding:11px 22px;border-radius:999px;border:none;font-size:.92rem;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.btn-primary{background:var(--primary);color:#fff} .btn-secondary{background:#fff;color:var(--muted);border:1px solid #ddd} .btn-red{background:#ef4444;color:#fff}
#select{max-width:850px;margin:auto;padding:38px 20px} h1{color:var(--primary);text-align:center;margin-bottom:8px} .sub{text-align:center;color:var(--muted);margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0} .stat{background:#fff;padding:14px;border-radius:12px;text-align:center;box-shadow:0 2px 8px #00000010} .stat b{display:block;font-size:1.3rem;color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px} .card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 8px #00000012;border:2px solid transparent;cursor:pointer} .card:hover{border-color:var(--primary)} .card h3{color:var(--primary);margin-bottom:5px} .card p{font-size:.85rem;color:var(--muted)}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px} .mini{padding:7px 11px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;font-weight:700;font-size:.8rem} .mini.exam{background:#fff7ed;border-color:#fdba74;color:#c2410c}
#quiz,#result{display:none;min-height:100vh;flex-direction:column} .header{position:sticky;top:0;background:var(--bg);z-index:5;padding:12px 18px;border-bottom:1px solid #ede9fe;display:flex;align-items:center;gap:12px} .back{border:none;background:none;font-size:1.2rem;cursor:pointer} .prog{flex:1} .bar{height:6px;background:#ede9fe;border-radius:5px;overflow:hidden} .fill{height:100%;background:linear-gradient(90deg,var(--primary),#a78bfa)} .plabel{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;margin-top:4px}
.body{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 20px} .qcard{width:100%;max-width:760px;background:#fff;border-radius:16px;padding:30px 34px;box-shadow:0 2px 12px #00000012;border-left:6px solid var(--primary)} .meta{font-size:.8rem;color:var(--muted);margin-bottom:12px} .qtext{font-size:1.08rem;line-height:2.45}
.blank{border:2px solid var(--ib);border-radius:6px;padding:4px 9px;min-width:90px;text-align:center;font:inherit;color:var(--text);background:#faf5ff;outline:none} .blank:focus{border-color:var(--if);box-shadow:0 0 0 3px #ede9fe} .blank.ok{background:var(--cBg);border-color:var(--cBd);color:var(--cTx);font-weight:700} .blank.hint{background:var(--hBg);border-color:var(--hBd);color:var(--hTx);font-weight:700}
.footer{padding:18px;display:flex;justify-content:center;gap:9px;flex-wrap:wrap} #result{align-items:center;justify-content:center;padding:30px;gap:16px} .resultcard{background:#fff;padding:28px 36px;border-radius:16px;text-align:center;box-shadow:0 2px 12px #00000012;max-width:430px;width:100%} .score{font-size:2.8rem;color:var(--primary);font-weight:800} .note{font-size:.85rem;color:var(--muted);margin-top:8px}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.qcard{padding:22px 18px}.qtext{font-size:1rem}}
</style>
</head>
<body>
<section id="select">
<h1>보관하역론 중간고사 타이핑 연습</h1>
<p class="sub">PPT 기반 핵심 100문제 · 시험모드 30문제 = 빈칸 1개 20문제 + 빈칸 2개 10문제</p>
<div class="stats">
 <div class="stat"><b id="sTotal">100</b>전체</div>
 <div class="stat"><b id="sNew">100</b>미암기</div>
 <div class="stat"><b id="sLearning">0</b>학습 중</div>
 <div class="stat"><b id="sMaster">0</b>암기 완료</div>
</div>
<div class="grid" id="grid"></div>
</section>

<section id="quiz">
 <div class="header"><button class="back" onclick="goHome()">←</button><div class="prog"><div class="bar"><div class="fill" id="fill"></div></div><div class="plabel"><span id="left"></span><span id="right"></span></div></div></div>
 <div class="body"><div class="qcard"><div class="meta" id="meta"></div><div class="qtext" id="qtext"></div></div></div>
 <div class="footer"><button class="btn btn-secondary" onclick="hint()">힌트</button><button class="btn btn-primary" onclick="next()">다음 문제 →</button></div>
</section>

<section id="result">
 <h1>학습 결과</h1><div class="resultcard"><div class="score" id="score"></div><div id="summary"></div><div class="note" id="rnote"></div></div>
 <div class="footer"><button class="btn btn-red" id="wrongBtn" onclick="retryWrong()">틀린 문제 다시</button><button class="btn btn-primary" onclick="goHome()">단원 선택으로</button></div>
</section>

<script>
const Q=[{"u": 1, "p": 2, "q": "보관은 생산과 소비의 거리조정을 통해 (시간적 효용)을 창출한다.", "a": ["시간적 효용"]}, {"u": 1, "p": 2, "q": "보관과 관련된 설비 기기는 (하드웨어)의 측면에 해당한다.", "a": ["하드웨어"]}, {"u": 1, "p": 2, "q": "보관방법에 관련된 재고관리는 (소프웨어)에 해당하는 관리기법이다.", "a": ["소프웨어|소프트웨어"]}, {"u": 1, "p": 2, "q": "보관은 Link와 Link를 이어주는 (Node)의 역할을 수행한다.", "a": ["Node|노드"]}, {"u": 1, "p": 3, "q": "보관에 필요한 충분한 공간을 확보하는 것은 (통로대면보관)의 원칙이다.", "a": ["통로대면보관"]}, {"u": 1, "p": 3, "q": "창고 전체의 유효공간을 증대시키는 것은 (높이쌓기)의 원칙이다.", "a": ["높이쌓기"]}, {"u": 1, "p": 3, "q": "짧은 라이프 사이클 관련 품목에 적용되는 원칙은 (선입선출)이다.", "a": ["선입선출|FIFO"]}, {"u": 1, "p": 3, "q": "입출하 빈도가 높은 화물을 출입구 가까운 장소에 보관하는 것은 (회전대응보관)의 원칙이다.", "a": ["회전대응보관"]}, {"u": 1, "p": 3, "q": "중량 및 대량물은 하층부, 경량품은 상층부에 보관하는 것은 (중량특성)의 원칙이다.", "a": ["중량특성"]}, {"u": 1, "p": 3, "q": "관련 품목을 한 장소에 모아 보관하는 것은 (네트워크 보관)의 원칙이다.", "a": ["네트워크 보관|네트워크보관"]}, {"u": 1, "p": 4, "q": "창고는 (보관공간) 중심이고 물류센터는 분류공간 중심이다.", "a": ["보관공간"]}, {"u": 1, "p": 4, "q": "고객 요구에 따라 상품의 부가가치를 높이는 가공활동을 (유통가공)이라 한다.", "a": ["유통가공"]}, {"u": 1, "p": 6, "q": "입고구와 출고구가 서로 반대편에 위치하는 방식은 (One-way 방식)이다.", "a": ["One-way 방식|One-way|Oneway 방식|Oneway"]}, {"u": 1, "p": 6, "q": "입고구와 출고구가 같은 방향에 위치하는 방식은 (U-turn 방식)이다.", "a": ["U-turn 방식|U-turn|U자형"]}, {"u": 1, "p": 2, "q": "보관의 역할에는 운송과 배송 사이의 (윤활유 기능)과 생산과 판매의 (조정 또는 완충기능)이 있다.", "a": ["윤활유 기능", "조정 또는 완충기능|완충기능|조정 또는 완충 기능"]}, {"u": 1, "p": 3, "q": "동일품목은 동일장소, 유사품은 인접 장소에 보관하는 것은 (동일성 및 유사성)의 원칙이고, 표준품은 랙을 사용하는 것은 (형상특성)의 원칙이다.", "a": ["동일성 및 유사성", "형상특성"]}, {"u": 1, "p": 4, "q": "창고의 주요 기능은 보관·하역·수송·(포장)·(유통가공)이다.", "a": ["포장", "유통가공"]}, {"u": 1, "p": 6, "q": "One-way 방식은 공간 활용도가 상대적으로 (낮음)이고, U-turn 방식은 공간 활용도가 매우 (높음)이다.", "a": ["낮음|낮다", "높음|높다"]}, {"u": 1, "p": 7, "q": "두 종류 이상의 운송수단 간 연계운송이 가능한 물류터미널은 (복합물류터미널)이고, 이를 제외한 것은 (일반물류터미널)이다.", "a": ["복합물류터미널", "일반물류터미널"]}, {"u": 1, "p": 16, "q": "하나의 컨테이너를 채우지 못한 소량화물은 (LCL), 한 컨테이너를 1개 화주의 화물로 채운 것은 (FCL)이다.", "a": ["LCL", "FCL"]}, {"u": 2, "p": 2, "q": "물품의 멸실 또는 훼손을 방지하기 위해 물품을 보관하도록 시설한 곳을 (창고)라 한다.", "a": ["창고"]}, {"u": 2, "p": 3, "q": "생산과 소비의 시간적 간격을 조정하는 창고의 역할은 (수급조정기능)이다.", "a": ["수급조정기능"]}, {"u": 2, "p": 3, "q": "물품의 수급을 조정하여 가격안정을 도모하는 창고의 역할은 (가격조정기능)이다.", "a": ["가격조정기능"]}, {"u": 2, "p": 4, "q": "물품·통로·운반기기·사람의 흐름 방향을 직진화하는 것은 (직진성)의 원칙이다.", "a": ["직진성"]}, {"u": 2, "p": 4, "q": "창고 운영절차는 입하 다음에 (오더피킹)이 진행된다.", "a": ["오더피킹"]}, {"u": 2, "p": 5, "q": "작업자 한 명이 주문 1건을 처리하는 방식은 (싱글 오더 피킹)이다.", "a": ["싱글 오더 피킹|Single Order Picking"]}, {"u": 2, "p": 6, "q": "여러 주문의 같은 상품을 한꺼번에 피킹한 뒤 주문별로 재분류하는 방식은 (배치 피킹)이다.", "a": ["배치 피킹|Batch Picking|total 피킹|토탈 피킹"]}, {"u": 2, "p": 6, "q": "창고를 여러 구역으로 나누고 작업자를 특정 구역에 배치하는 방식은 (존 피킹)이다.", "a": ["존 피킹|Zone Picking"]}, {"u": 2, "p": 7, "q": "출고 시간·배송 지역·운송 차량 등의 기준으로 주문을 묶어 처리하는 방식은 (웨이브 피킹)이다.", "a": ["웨이브 피킹|Wave Picking"]}, {"u": 2, "p": 8, "q": "상품 선반의 램프에 불이 들어오면 표시된 수량만큼 꺼내는 시스템은 (DPS)이다.", "a": ["DPS|Digital Picking System"]}, {"u": 2, "p": 8, "q": "피킹한 상품의 바코드를 찍어 고객별 박스의 불빛으로 분류를 안내하는 시스템은 (DAS)이다.", "a": ["DAS|Digital Assorting System"]}, {"u": 2, "p": 8, "q": "로봇이 상품 선반을 작업자에게 가져다주는 방식은 (GTP)이다.", "a": ["GTP|Goods-to-Person"]}, {"u": 2, "p": 8, "q": "작업자를 따라다니며 무거운 짐을 옮기는 자율주행 물류 로봇은 (AMR)이다.", "a": ["AMR"]}, {"u": 2, "p": 14, "q": "공단과 항만 간 원활한 화물유통을 위한 내륙컨테이너기지는 (ICD)이다.", "a": ["ICD|Inland Container Depot"]}, {"u": 2, "p": 2, "q": "창고 구성 중 물건을 적재하기 위해 확보된 공간은 (적재공간)이고, 창고바닥에서 보 밑까지의 높이는 (보의 높이)이다.", "a": ["적재공간", "보의 높이"]}, {"u": 2, "p": 4, "q": "창고 운영절차는 입하 → 오더피킹 → (검품) → (포장) → 출하 순이다.", "a": ["검품", "포장"]}, {"u": 2, "p": 6, "q": "싱글 오더 피킹은 오류가 (적고), 배치 피킹은 피킹 후 주문별 (재분류) 작업이 필요하다.", "a": ["적고|적다", "재분류|소팅"]}, {"u": 2, "p": 8, "q": "DPS는 주로 (피킹)을 안내하고, DAS는 주로 고객별 (분류)를 안내한다.", "a": ["피킹", "분류|어소팅|Assorting"]}, {"u": 2, "p": 14, "q": "ICD는 (CY)와 (CFS) 등을 주요 시설로 구성한다.", "a": ["CY|Container Yard", "CFS|Container Freight Station"]}, {"u": 2, "p": 14, "q": "스톡포인트보다 규모가 작은 국내용 2차 창고는 (데포)이고, 대도시·지방중소도시의 배송 중계기지는 (스톡포인트)이다.", "a": ["데포|DP|Depot", "스톡포인트|SP|Stock Point"]}, {"u": 3, "p": 2, "q": "창고 재고에서 수주받은 물품을 주문별로 선별·모아 출하하는 과정을 (오더피킹)이라 한다.", "a": ["오더피킹|Order Picking"]}, {"u": 3, "p": 2, "q": "보관장소에서 물품을 꺼내 주문별로 집화하는 것은 오더피킹의 (협의) 개념이다.", "a": ["협의"]}, {"u": 3, "p": 2, "q": "오더피킹은 유통창고 작업량의 약 (30~40%)를 차지한다.", "a": ["30~40%|30-40%|30~40"]}, {"u": 3, "p": 3, "q": "한 건의 주문마다 물품을 피킹해서 모으는 방법은 (싱글오더피킹)이다.", "a": ["싱글오더피킹|싱글 오더 피킹|single order picking"]}, {"u": 3, "p": 3, "q": "여러 건의 주문전표를 합쳐서 피킹하는 방법은 (일괄 오더피킹)이다.", "a": ["일괄 오더피킹|batch order picking|배치 오더피킹"]}, {"u": 3, "p": 3, "q": "반나절 또는 하루의 주문전표를 모아 한 번에 피킹하는 방법은 (총량피킹방법)이다.", "a": ["총량피킹방법|총량피킹"]}, {"u": 3, "p": 3, "q": "담당 작업범위의 품목만 피킹하고 다음 피커에게 인계하는 방법은 (릴레이방법)이다.", "a": ["릴레이방법|릴레이 방법|relay"]}, {"u": 3, "p": 3, "q": "여러 피커가 각각 분담한 단위공간에서 작업하는 방식은 (존 피킹)이다.", "a": ["존 피킹|zone picking|group picking"]}, {"u": 3, "p": 3, "q": "고속자동분류 컨베이어로 일괄 피킹한 물품을 고객별로 분류하는 방식은 (어소트방법)이다.", "a": ["어소트방법|어소트 방법|assort"]}, {"u": 3, "p": 4, "q": "상품수보다 거래처수가 많을 때 적합한 방식은 (적재방법)이다.", "a": ["적재방법"]}, {"u": 3, "p": 4, "q": "상품수가 거래처수보다 많을 때 적합한 방식은 (파종방법)이다.", "a": ["파종방법"]}, {"u": 3, "p": 6, "q": "오더피킹의 출고형태에는 파렛트·케이스·단품 또는 (복합형태)가 있다.", "a": ["복합형태"]}, {"u": 3, "p": 2, "q": "인력에 의한 피킹은 주로 (다품종 소량)에 사용된다.", "a": ["다품종 소량"]}, {"u": 3, "p": 2, "q": "물건을 피커 위치로 가져오는 방식의 예에는 (회전선반)이 있다.", "a": ["회전선반|Carousel|캐러셀"]}, {"u": 3, "p": 3, "q": "주문형태별 분류에서 여러 주문을 합치는 것은 (일괄 오더피킹)이고, 하루 주문을 한 번에 모으는 것은 (총량피킹방법)이다.", "a": ["일괄 오더피킹|batch order picking", "총량피킹방법|총량피킹"]}, {"u": 3, "p": 4, "q": "적재방법은 (품목별 피킹), 파종방법은 (거래처별 피킹) 방식이다.", "a": ["품목별 피킹", "거래처별 피킹"]}, {"u": 3, "p": 5, "q": "적재방법은 먼저 출고해야 할 품목을 (우선 출고)할 수 있고, 상품별 (재고관리)도 동시에 이루어진다.", "a": ["우선 출고", "재고관리"]}, {"u": 3, "p": 5, "q": "파종방법은 대형의 안정된 작업량에 적합하여 (작업자)를 대폭 줄일 수 있지만, 적재방법보다 (하나의 공정)이 더 많다.", "a": ["작업자", "하나의 공정|1개의 공정|한 공정"]}, {"u": 3, "p": 6, "q": "파렛트 단위로 보관하고 파렛트 단위로 피킹하는 약식기호는 (P→P)이고, 대표 운반기기는 (포크리프트)이다.", "a": ["P→P|P->P", "포크리프트"]}, {"u": 3, "p": 2, "q": "오더피킹의 광의 개념에는 물품의 피킹뿐 아니라 정돈·포장 및 배송지역별 (상차)까지 포함되고, 협의 개념은 주문별 (집화)를 의미한다.", "a": ["상차", "집화"]}, {"u": 4, "p": 2, "q": "수요와 보충 조달기간의 변동에 대한 방지책으로 보유하는 재고는 (안전재고)이다.", "a": ["안전재고"]}, {"u": 4, "p": 2, "q": "한 지점에서 다른 지점으로 이동 중인 재고는 (수송중인 재고)이다.", "a": ["수송중인 재고|수송 중인 재고"]}, {"u": 4, "p": 2, "q": "평균 수요를 충족시키는 데 필요한 재고는 (순환재고)이다.", "a": ["순환재고"]}, {"u": 4, "p": 2, "q": "손실·손상·진부화되어 사용 가능성이 낮은 재고는 (침몰재고)이다.", "a": ["침몰재고|불용재고|침몰(또는 불용)재고"]}, {"u": 4, "p": 3, "q": "출하가격을 기준으로 중요도를 나누어 관리하는 방법은 (ABC분석)이다.", "a": ["ABC분석|ABC 분석"]}, {"u": 4, "p": 3, "q": "사장재고(Dead Stock)는 약 (1개월에 1회) 확인 후 조절한다.", "a": ["1개월에 1회|한 달에 1회|1개월 1회"]}, {"u": 4, "p": 5, "q": "수주량에 대한 납기 내 충족비율을 (서비스율)이라 한다.", "a": ["서비스율"]}, {"u": 4, "p": 5, "q": "제품 요구량에 대한 결품률을 (Back Order율)이라 한다.", "a": ["Back Order율|Back Order 율|백오더율"]}, {"u": 4, "p": 5, "q": "재고회전율은 총매출량을 (평균재고량)으로 나누어 계산한다.", "a": ["평균재고량|평균재고액"]}, {"u": 4, "p": 6, "q": "서비스 수준 95%일 때 안전계수 t값은 (1.65)이다.", "a": ["1.65"]}, {"u": 4, "p": 6, "q": "서비스 수준 99%일 때 안전계수 t값은 (2.33)이다.", "a": ["2.33"]}, {"u": 4, "p": 7, "q": "보관비용과 판매기회 상실의 상충비용 총합계가 최소가 되는 재고수준은 (적정재고)이다.", "a": ["적정재고"]}, {"u": 4, "p": 8, "q": "구매관리의 5가지 조건 중 거래선을 뜻하는 영어는 (Vendor)이다.", "a": ["Vendor|벤더"]}, {"u": 4, "p": 8, "q": "구매관리의 5가지 조건 중 최소의 비용을 뜻하는 영어는 (Cost)이다.", "a": ["Cost|코스트"]}, {"u": 4, "p": 2, "q": "재고관리의 목적은 품절 손실과 (재고 유지비용) 및 (발주 비용)을 최적화하여 총비용을 최소화하는 것이다.", "a": ["재고 유지비용|재고유지비용", "발주 비용|발주비용"]}, {"u": 4, "p": 4, "q": "재고관리의 역할에는 (수요공급의 조절)과 불확실성에 대한 (대비)가 있다.", "a": ["수요공급의 조절|수요공급 조절", "대비"]}, {"u": 4, "p": 5, "q": "서비스율 = (납기 내 납품수량) / (수주량) × 100이다.", "a": ["납기 내 납품수량|납기내 납품수량", "수주량"]}, {"u": 4, "p": 6, "q": "안전재고량 = 안전계수 × (수요의 표준편차) × √(조달기간)이다.", "a": ["수요의 표준편차", "조달기간|리드타임"]}, {"u": 4, "p": 7, "q": "과다재고는 서비스율이 (높고) 재고회전율이 (나쁨)인 반면, 과소재고는 반대 경향을 보인다.", "a": ["높고|높다", "나쁨|나쁘다"]}, {"u": 4, "p": 8, "q": "구매관리의 5가지 조건은 Vendor·Quality·Delivery·(Quantity)·(Cost)이다.", "a": ["Quantity", "Cost"]}, {"u": 5, "p": 2, "q": "자재만을 대상으로 하는 자재소요계획은 (MRP)이다.", "a": ["MRP|Material Requirements Planning"]}, {"u": 5, "p": 2, "q": "자재·자금·인력·시설 등의 제조자원을 통합적으로 계획·통제하는 시스템은 (MRPⅡ)이다.", "a": ["MRPⅡ|MRP II|Manufacturing Resource Planning II"]}, {"u": 5, "p": 2, "q": "기업 내외의 모든 자원을 통합적으로 관리하는 시스템은 (ERP)이다.", "a": ["ERP|Enterprise Resource Planning"]}, {"u": 5, "p": 3, "q": "MRP에서 완제품 생산수량과 일정을 나타내는 것은 (주일정계획)이다.", "a": ["주일정계획|MPS"]}, {"u": 5, "p": 3, "q": "최종품목과 각 구성품 간 관계를 나타내는 것은 (자재명세서)이다.", "a": ["자재명세서|BOM"]}, {"u": 5, "p": 3, "q": "각 품목의 재고에 관한 모든 정보를 제공하는 것은 (재고기록철)이다.", "a": ["재고기록철|Inventory Records File"]}, {"u": 5, "p": 6, "q": "MRP의 효과 중 주일정계획에 따라 부품을 주문하여 재고를 줄이는 것은 (재고요구량 감소)이다.", "a": ["재고요구량 감소"]}, {"u": 5, "p": 6, "q": "MRP는 (Batch) 시스템이므로 생산차질 발생 시 빈번한 계획수정이 필요하다.", "a": ["Batch|배치"]}, {"u": 5, "p": 7, "q": "필요할 때 수요에 맞추어 공급하는 적시생산방식은 (JIT)이다.", "a": ["JIT|Just In Time"]}, {"u": 5, "p": 7, "q": "후속공정에서 인수해 간 만큼 선행공정에서 생산해 보충하는 방식은 (Pull System)이다.", "a": ["Pull System|풀시스템|풀 시스템"]}, {"u": 5, "p": 7, "q": "JIT는 일본의 (도요타) 생산시스템에서 도입된 개념이다.", "a": ["도요타|Toyota"]}, {"u": 5, "p": 20, "q": "선반의 바코드를 스캔하면 공급자에게 자동으로 발주정보를 전송하는 시스템은 (CAO)이다.", "a": ["CAO|Computer Aided Ordering"]}, {"u": 5, "p": 22, "q": "전문가 의견을 수렴해 미래를 예측하는 정성적 기법은 (델파이기법)이다.", "a": ["델파이기법|델파이법"]}, {"u": 5, "p": 24, "q": "과거 몇 기간의 실제치를 평균하여 다음 기간의 예측치로 사용하는 방법은 (단순이동평균법)이다.", "a": ["단순이동평균법|이동평균법"]}, {"u": 5, "p": 2, "q": "자원관리시스템은 (MRP) → (MRPⅡ) → ERP → ERPⅡ 순으로 발전하였다.", "a": ["MRP", "MRPⅡ|MRP II"]}, {"u": 5, "p": 3, "q": "MRP의 구성요소에는 (MPS)와 (BOM)이 포함된다.", "a": ["MPS|주일정계획", "BOM|자재명세서"]}, {"u": 5, "p": 7, "q": "JIT의 목표에는 재고와 낭비의 (Zero)화, 그리고 (리드타임)의 단축이 있다.", "a": ["Zero|제로", "리드타임"]}, {"u": 5, "p": 21, "q": "시계열 수요자료의 패턴에는 추세·순환·(계절변동)·(우연변동)이 있다.", "a": ["계절변동", "우연변동|불규칙변동"]}, {"u": 5, "p": 22, "q": "수요예측 기법은 크게 (정성적 예측기법)과 (계량적 예측기법)으로 구분된다.", "a": ["정성적 예측기법|정성적 기법", "계량적 예측기법|계량적 기법"]}, {"u": 5, "p": 26, "q": "지수평활법은 최근 자료일수록 (더 큰 가중치), 과거 자료일수록 (더 작은 가중치)를 둔다.", "a": ["더 큰 가중치|큰 가중치", "더 작은 가중치|작은 가중치"]}];
const names={1:"제1장 보관관리",2:"제2장 창고관리",3:"제3장 보관 및 창고관리 시스템",4:"제4장 재고관리",5:"제5장 재고·자재관리시스템"};
const key="storageHandlingMidterm100_v1";
let state=JSON.parse(localStorage.getItem(key)||"{}");
let list=[],idx=0,ok=0,bad=0,wrong=[],modeLabel="";

function save(){localStorage.setItem(key,JSON.stringify(state)); updateStats();}
function st(id){return state[id]||(state[id]={streak:0,correct:0,wrong:0,hint:0})}
function status(id){let s=st(id); return s.streak>=3?"master":(s.correct>0||s.wrong>0||s.hint>0)?"learning":"new"}
function updateStats(){
 let n=0,l=0,m=0; Q.forEach(q=>{let z=status(q.id); if(z==="new")n++;else if(z==="learning")l++;else m++;});
 sNew.textContent=n;sLearning.textContent=l;sMaster.textContent=m;
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function weighted(arr){
 let pool=[]; arr.forEach(q=>{let z=status(q.id),w=z==="new"?4:z==="learning"?6:1; if(st(q.id).wrong>0)w+=3; for(let i=0;i<w;i++)pool.push(q)});
 let out=[],used=new Set(); for(let q of shuffle(pool)){if(!used.has(q.id)){out.push(q);used.add(q.id)}}; return out;
}
function build(){
 grid.innerHTML="";
 for(let u=1;u<=5;u++){let d=document.createElement("div");d.className="card";d.innerHTML=`<h3>${names[u]}</h3><p>핵심 20문제 · 단일 14 / 이중 6</p><div class="modes"><button class="mini" onclick="event.stopPropagation();startUnit(${u})">타이핑 20</button><button class="mini" onclick="event.stopPropagation();startWeak(${u})">오답/미암기</button></div>`;grid.appendChild(d)}
 let d=document.createElement("div");d.className="card";d.innerHTML=`<h3>전체 범위</h3><p>제1~5장 핵심 100문제</p><div class="modes"><button class="mini exam" onclick="event.stopPropagation();startExam()">🎯 시험모드 30</button><button class="mini" onclick="event.stopPropagation();startAll()">전체 100</button><button class="mini" onclick="event.stopPropagation();startWeak()">오답/미암기</button></div>`;grid.appendChild(d);
}
function start(arr,label){list=arr;idx=0;ok=0;bad=0;wrong=[];modeLabel=label;select.style.display="none";result.style.display="none";quiz.style.display="flex";render()}
function startUnit(u){start(weighted(Q.filter(q=>q.u===u)),names[u]+" 타이핑")}
function startAll(){start(weighted(Q),"전체 100문제")}
function startWeak(u=null){let a=Q.filter(q=>(!u||q.u===u)&&status(q.id)!=="master"); if(!a.length)a=Q.filter(q=>!u||q.u===u);start(weighted(a),(u?names[u]:"전체")+" 오답/미암기")}
function startExam(){
 let singles=weighted(Q.filter(q=>q.a.length===1)).slice(0,20);
 let doubles=weighted(Q.filter(q=>q.a.length===2)).slice(0,10);
 start(shuffle([...singles,...doubles]),"실전 시험모드 30문제");
}
function normalize(s){return s.trim().replace(/\s+/g,"").toLowerCase().replace(/[Ⅱⅱ]/g,"ii")}
function firstAns(s){return s.split("|")[0]}
function render(){
 if(idx>=list.length)return finish();
 let q=list[idx]; meta.textContent=`${modeLabel} · ${names[q.u]} · PPT ${q.p}p · ${q.a.length===2?"빈칸 2개":"빈칸 1개"}`;
 let html=q.q, k=0;
 html=html.replace(/\(([^()]+)\)/g,(m,inside)=>{
   if(k>=q.a.length)return m;
   let ans=q.a[k++]; return `<input class="blank" data-answer="${ans.replace(/"/g,"&quot;")}" placeholder="빈칸 ${k}" autocomplete="off">`;
 });
 qtext.innerHTML=html;
 left.textContent=`${idx+1} / ${list.length}`; right.textContent=`정답 ${ok} · 오답/힌트 ${bad}`; fill.style.width=`${idx/list.length*100}%`;
 document.querySelector(".blank")?.focus();
 document.querySelectorAll(".blank").forEach(x=>x.addEventListener("keydown",e=>{if(e.key==="Enter")next()}));
}
function check(){
 let q=list[idx], ins=[...document.querySelectorAll(".blank")], all=true, hadBad=false;
 ins.forEach((x,i)=>{
   if(x.disabled){if(x.classList.contains("hint"))hadBad=true;return}
   let opts=q.a[i].split("|").map(normalize); if(opts.includes(normalize(x.value)) && x.value.trim()){x.value=firstAns(q.a[i]);x.classList.add("ok");x.disabled=true}
   else{all=false;x.focus()}
 });
 return {all,hadBad};
}
function next(){
 let q=list[idx],ins=[...document.querySelectorAll(".blank")];
 if(ins.some(x=>!x.disabled)){
   let c=check(); if(!c.all)return;
 }
 let usedHint=ins.some(x=>x.classList.contains("hint"));
 let s=st(q.id);
 if(usedHint){s.hint++;s.streak=0;bad++;wrong.push(q)} else {s.correct++;s.streak++;ok++;}
 save();idx++;render();
}
function hint(){
 let q=list[idx],ins=[...document.querySelectorAll(".blank")]; ins.forEach((x,i)=>{if(!x.disabled){x.value=firstAns(q.a[i]);x.classList.add("hint");x.disabled=true}});
}
function finish(){
 quiz.style.display="none";result.style.display="flex";let total=ok+bad,p=total?Math.round(ok/total*100):0;score.textContent=p+"%";summary.textContent=`정답 ${ok}개 · 오답/힌트 ${bad}개 · 총 ${list.length}문제`;rnote.textContent="힌트 없이 3회 연속 정답하면 암기 완료로 처리됩니다.";wrongBtn.style.display=wrong.length?"":"none";
}
function retryWrong(){let uniq=[...new Map(wrong.map(q=>[q.id,q])).values()];start(uniq,"틀린 문제 복습")}
function goHome(){quiz.style.display="none";result.style.display="none";select.style.display="block";updateStats()}
build();updateStats();
</script>
